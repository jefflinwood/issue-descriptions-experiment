[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-specification"
version = "0.1.0"
description = "Experiment 002: how issue descriptions affect coding-agent implementation outcomes"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
issue-specification = "issue_specification.cli:main"

[tool.setuptools.packages.find]
include = ["issue_specification*"]
